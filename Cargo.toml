[package]
name = "canon-clerk"
version = "0.1.0"
edition = "2024"

[lib]
name = "canon_clerk"
path = "src/lib.rs"

[[bin]]
name = "canon-clerk"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = "0.12"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0"
anyhow = "1.0"
glob = "0.3"
